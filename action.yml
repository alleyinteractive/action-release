name: 'Build and Release WordPress Plugin'
description: 'Create build releases of your create-wordpress-plugin WordPress projects.'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  build-command:
    description: 'Specify the command to run for build.'
    required: false
    default: 'npm run build'
  draft:
    description: 'Specify whether to create a draft release.'
    required: false
    default: 'false'
  github-token:
    description: 'Specify the GitHub token to use.'
    required: false
    default: ${{ github.token }}
  node-version:
    description: 'Specify the version of Node.js to use.'
    required: false
    default: ''
  php-version:
    description: 'Specify the version of PHP to use.'
    required: false
    default: ''
  skip-build:
    description: 'Specify whether to skip the build step.'
    required: false
    default: 'false'
  skip-composer-install:
    description: 'Specify whether to skip the composer install step.'
    required: false
    default: 'false'
  skip-composer-require-removal:
    description: 'Skip the removal of the require/require-dev sections in the composer.json file'
    default: 'false'
    required: false
  skip-npm-install:
    description: 'Specify whether to skip the npm install step.'
    required: false
    default: 'false'
  scope:
    description: 'Scope (prefix) the plugin''s Composer dependencies via `composer scope` before release. Requires the plugin to be configured for scoping (create-wordpress-plugin).'
    required: false
    default: 'false'
  use-changelog-notes:
    description: 'Use notes from the CHANGELOG.md file (if found) instead of generating release notes.'
    required: false
    default: 'true'
  plugin-file:
    description: 'Specify the main plugin file name (e.g., my-plugin.php) to extract the version from.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token || github.token }}

    # Extract data about the project.
    # The format is:
    #   id: extract-data-name
    #   Outputted to value="..."
    #   Referenced as steps.extract-data-name.outputs.value.
    #
    # NOTE: To avoid shell injection, step outputs and inputs that can contain
    # arbitrary content (changelog text, branch names, etc.) are passed to
    # scripts via `env:` rather than interpolated with ${{ }} inside `run:`.

    - name: Extract plugin version
      shell: bash
      id: extract-version
      env:
        PLUGIN_FILE: '${{ inputs.plugin-file }}'
      run: |
        PACKAGE_VERSION=""
        PLUGIN_NAME=$(basename $(pwd))

        echo "Using Plugin Name: $PLUGIN_NAME"

        extract-version() {
          grep -E "Version:\s*[0-9]+\.[0-9]+\.[0-9]+" $1 | grep -Eo "[0-9]+\.[0-9]+\.[0-9]+" | head -1
        }

        if [ -n "$PLUGIN_FILE" ] && [ -f "$PLUGIN_FILE" ]; then
          echo "Using specified plugin file: $PLUGIN_FILE"
          PACKAGE_VERSION=$(extract-version "$PLUGIN_FILE")
        elif [ -f "$PLUGIN_NAME.php" ]; then
          PACKAGE_VERSION=$(extract-version "$PLUGIN_NAME.php")
        elif [ -f "plugin.php" ]; then
          PACKAGE_VERSION=$(extract-version "plugin.php")
        fi

        if [ -f composer.json ] && [ -z "$PACKAGE_VERSION" ]; then
          PACKAGE_VERSION=$(cat composer.json | jq -r '.version')

          if [ "$PACKAGE_VERSION" = "null" ]; then
            PACKAGE_VERSION=""
          fi
        fi

        if [ -f package.json ] && [ -z "$PACKAGE_VERSION" ]; then
          PACKAGE_VERSION=$(cat package.json | jq -r '.version')

          if [ "$PACKAGE_VERSION" = "null" ]; then
            PACKAGE_VERSION=""
          fi
        fi

        # Validate that we have a semver version number
        if [ -n "$PACKAGE_VERSION" ]; then
          if ! [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid version number: $PACKAGE_VERSION"
            exit 1
          fi
        fi

        # Ignore the version if it's 0.0.0
        if [ "$PACKAGE_VERSION" = "0.0.0" ]; then
          PACKAGE_VERSION=""
        fi

        echo "Package Version: $PACKAGE_VERSION"

        if [ -z "$PACKAGE_VERSION" ]; then
          echo "value=false" >> $GITHUB_OUTPUT
        else
          echo "value=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Extract branch name
      shell: bash
      id: extract-branch
      run: echo "value=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Check if this is a built branch
      id: extract-is-built-branch
      shell: bash
      env:
        CURRENT_BRANCH: '${{ steps.extract-branch.outputs.value }}'
      run: |
        if [[ "$CURRENT_BRANCH" =~ -built$ ]]; then
          echo "value=true" >> $GITHUB_OUTPUT
        else
          echo "value=false" >> $GITHUB_OUTPUT
        fi

    - name: Compile the tag name from the version
      id: extract-tag-name
      shell: bash
      if: steps.extract-version.outputs.value != 'false'
      env:
        PACKAGE_VERSION: '${{ steps.extract-version.outputs.value }}'
      run: echo "value=v${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

    - name: Check if the version already exists as a tag
      id: extract-tag-exists
      shell: bash
      if: steps.extract-version.outputs.value != 'false' && steps.extract-tag-name.outputs.value
      env:
        TAG_NAME: '${{ steps.extract-tag-name.outputs.value }}'
      run: |
        if [ -z "$(git tag -l "$TAG_NAME")" ]; then
          echo "value=false" >> $GITHUB_OUTPUT
        else
          echo "value=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract previous tag version
      id: extract-previous-tag
      shell: bash
      if: steps.extract-tag-exists.outputs.value == 'false' && steps.extract-version.outputs.value != 'false'
      run: |
        # Get the release tag for comparison
        PREVIOUS_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")

        # If there is no previous tag, then we can't compare
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "value=false" >> $GITHUB_OUTPUT
        else
          echo "value=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
        fi

    - name: Check if the project has front-end assets
      shell: bash
      id: extract-has-node-assets
      run: |
        [[ -f package.json ]] && echo "value=true" >> $GITHUB_OUTPUT || echo "value=false" >> $GITHUB_OUTPUT

    - name: Extract PHP version from composer.json
      shell: bash
      id: extract-php-version
      env:
        DEFAULT_PHP_VERSION: '8.2'
        PHP_VERSION: '${{ inputs.php-version }}'
      run: |
        if [[ -z "$PHP_VERSION" ]]; then
          PHP_VERSION="$DEFAULT_PHP_VERSION"

          if [ -f composer.json ]; then
            PHP_REQUIREMENT=$(cat composer.json | jq -r '.require.php // empty' 2>/dev/null || echo "")

            PHP_VERSION=$(echo "$PHP_REQUIREMENT" | sed 's/^\^//')
            PHP_VERSION=$(echo "$PHP_VERSION" | sed 's/^\(\^\|>=\)//')
          else
            echo "No composer.json found, using input default: $PHP_VERSION"
          fi

          if [[ -z "$PHP_VERSION" ]]; then
            echo "Falling back to default PHP version: $DEFAULT_PHP_VERSION"
            PHP_VERSION="$DEFAULT_PHP_VERSION"
          else
            echo "Using inferred PHP version: $PHP_VERSION"
          fi
        else
          echo "Using inputted PHP version: $PHP_VERSION"
        fi

        echo "value=$PHP_VERSION" >> $GITHUB_OUTPUT

    - name: Extract Node version from package.json
      if: steps.extract-has-node-assets.outputs.value == 'true' && inputs.skip-npm-install != 'true'
      id: extract-node-version
      shell: bash
      env:
        DEFAULT_NODE_VERSION: 'lts/*'
        NODE_VERSION: '${{ inputs.node-version  }}'
      run: |
        if [ -z "$NODE_VERSION" ]; then
          NODE_VERSION="$DEFAULT_NODE_VERSION"

          if [ -f package.json ]; then
            NODE_VERSION=$(cat package.json | jq -r '.engines.node // empty' 2>/dev/null || echo "")

            if [[ -z "$NODE_VERSION" ]]; then
              echo "Unable to find node version, falling back to default version: $DEFAULT_NODE_VERSION"
              NODE_VERSION="$DEFAULT_NODE_VERSION"
            else
              echo "Using Node version from package.json: $NODE_VERSION"
            fi
          fi
        else
          echo "Using inputted Node version: $NODE_VERSION"
        fi

        echo "value=$NODE_VERSION" >> $GITHUB_OUTPUT

    - name: Parse the changelog
      if: inputs.use-changelog-notes == 'true' && steps.extract-version.outputs.value != 'false'
      id: parse-changelog
      uses: alleyinteractive/action-changelog-extractor@develop
      with:
        version: '${{ steps.extract-version.outputs.value }}'

    - name: Extract the changelog notes if requested
      if: inputs.use-changelog-notes == 'true' && steps.extract-version.outputs.value != 'false' && steps.parse-changelog.outputs.result != ''
      id: extract-changelog-notes
      shell: bash
      env:
        PACKAGE_VERSION: '${{ steps.extract-version.outputs.value }}'
        PARSE_CHANGELOG_RESULT: ${{ steps.parse-changelog.outputs.result }}
      run: |
        if [ ! -f CHANGELOG.md ]; then
          echo "🚨 CHANGELOG.md file not found. Skipping changelog extraction."
          exit 0
        fi

        echo "Using changelog notes for version $PACKAGE_VERSION"
        echo "Parsed changelog notes: (JSON length: ${#PARSE_CHANGELOG_RESULT} characters)"

        # Save the raw JSON to a file. printf '%s' writes the value verbatim
        # with no escape-sequence processing.
        printf '%s' "$PARSE_CHANGELOG_RESULT" > /tmp/changelog_raw.json

        CHANGELOG_CONTENTS=$(jq -r '.[0].contents // empty' /tmp/changelog_raw.json)
        echo "Changelog contents: (content length: ${#CHANGELOG_CONTENTS} characters)"

        if [[ -z "$CHANGELOG_CONTENTS" ]]; then
          echo "🚨 No changelog contents found. Exiting."
          exit 1
        fi

        # Save the extracted content to a file to preserve special characters
        printf '%s\n' "$CHANGELOG_CONTENTS" > /tmp/changelog_content.txt

        # Set a simple flag in GITHUB_OUTPUT
        echo "value=success" >> $GITHUB_OUTPUT

    - name: Set environment variables
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: '${{ inputs.github-token }}'
        DEFAULT_GITHUB_TOKEN: '${{ github.token }}'
        INPUT_SKIP_BUILD: '${{ inputs.skip-build }}'
        INPUT_SKIP_COMPOSER_INSTALL: '${{ inputs.skip-composer-install }}'
        INPUT_SKIP_NPM_INSTALL: '${{ inputs.skip-npm-install }}'
        INPUT_USE_CHANGELOG_NOTES: '${{ inputs.use-changelog-notes }}'
        CURRENT_BRANCH: '${{ steps.extract-branch.outputs.value }}'
        TAG_NAME: '${{ steps.extract-tag-name.outputs.value }}'
        CHANGELOG_EXTRACT_RESULT: '${{ steps.extract-changelog-notes.outputs.value }}'
      run: |
        echo "GITHUB_TOKEN=$([ -n "$INPUT_GITHUB_TOKEN" ] && echo "$INPUT_GITHUB_TOKEN" || echo "$DEFAULT_GITHUB_TOKEN")" >> $GITHUB_ENV
        echo "SKIP_BUILD=$([ "$INPUT_SKIP_BUILD" = "true" ] && echo "true" || echo "false")" >> $GITHUB_ENV
        echo "SKIP_COMPOSER_INSTALL=$([ "$INPUT_SKIP_COMPOSER_INSTALL" = "true" ] && echo "true" || echo "false")" >> $GITHUB_ENV
        echo "SKIP_NPM_INSTALL=$([ "$INPUT_SKIP_NPM_INSTALL" = "true" ] && echo "true" || echo "false")" >> $GITHUB_ENV
        echo "BUILT_BRANCH=${CURRENT_BRANCH}-built" >> $GITHUB_ENV
        echo "VERSION_TAG=$([ -n "$TAG_NAME" ] && echo "$TAG_NAME" || echo "false")" >> $GITHUB_ENV

        # Read changelog contents from file to preserve special characters like backticks
        if [[ "$INPUT_USE_CHANGELOG_NOTES" == "true" && "$CHANGELOG_EXTRACT_RESULT" == "success" ]]; then
          if [ -f /tmp/changelog_content.txt ]; then
            CHANGELOG_CONTENTS=$(cat /tmp/changelog_content.txt)

            if [[ -n "$CHANGELOG_CONTENTS" ]]; then
              echo "USE_CHANGELOG_NOTES=true" >> $GITHUB_ENV

              # Use a random heredoc delimiter so changelog content can never
              # contain the delimiter line and break out of the value.
              DELIMITER="CHANGELOG_EOF_$(openssl rand -hex 8 2>/dev/null || date +%s%N)"
              {
                echo "CHANGELOG_CONTENTS<<${DELIMITER}"
                echo "$CHANGELOG_CONTENTS"
                echo "${DELIMITER}"
              } >> $GITHUB_ENV
            else
              echo "USE_CHANGELOG_NOTES=false" >> $GITHUB_ENV
              echo "CHANGELOG_CONTENTS=" >> $GITHUB_ENV
            fi

            # Clean up temporary files
            rm -f /tmp/changelog_raw.json /tmp/changelog_content.txt
          else
            echo "USE_CHANGELOG_NOTES=false" >> $GITHUB_ENV
            echo "CHANGELOG_CONTENTS=" >> $GITHUB_ENV
          fi
        else
          echo "USE_CHANGELOG_NOTES=false" >> $GITHUB_ENV
          echo "CHANGELOG_CONTENTS=" >> $GITHUB_ENV
        fi

    - name: Composer Install
      if: inputs.skip-composer-install != 'true' && inputs.scope != 'true'
      uses: alleyinteractive/action-test-php@develop
      with:
        install-command: 'composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader'
        php-version: '${{ steps.extract-php-version.outputs.value }}'
        skip-audit: 'true'
        skip-services: 'true'
        skip-test: 'true'
        skip-wordpress-install: 'true'

    # When scoping, dev tooling (php-scoper) must be present, so dev
    # dependencies are installed. They are not shipped: only the prefixed
    # vendor-prefixed/ directory is committed to the built branch (vendor/ is
    # excluded via the plugin's .deployignore), and the require/require-dev
    # sections are pruned below.
    - name: Composer Install (with scoping)
      if: inputs.skip-composer-install != 'true' && inputs.scope == 'true'
      uses: alleyinteractive/action-test-php@develop
      with:
        install-command: 'composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader'
        php-version: '${{ steps.extract-php-version.outputs.value }}'
        skip-audit: 'true'
        skip-services: 'true'
        skip-test: 'true'
        skip-wordpress-install: 'true'

    - name: Scope Composer dependencies
      if: inputs.skip-composer-install != 'true' && inputs.scope == 'true'
      shell: bash
      run: composer scope

    # Prune require/require-dev so the released artifact does not re-resolve
    # (and re-conflict) dependencies when installed. Enabled when scoping, since
    # the prefixed dependencies ship in vendor-prefixed/ instead.
    - name: Clear composer require/require-dev
      if: inputs.skip-composer-install != 'true' && inputs.scope == 'true' && inputs.skip-composer-require-removal != 'true'
      shell: bash
      run: |
        jq 'del(.require, .["require-dev"])' composer.json > composer.json.tmp
        mv composer.json.tmp composer.json
        rm -rf composer.lock composer.json.bak || true

    - name: NPM Install and Build
      uses: alleyinteractive/action-test-node@develop
      if: steps.extract-has-node-assets.outputs.value == 'true' && inputs.skip-npm-install != 'true'
      with:
        build-command: '${{ inputs.build-command }}'
        node-version: '${{ steps.extract-node-version.outputs.value }}'
        skip-audit: 'true'
        skip-test: 'true'

    - name: Push to ${{ steps.extract-branch.outputs.value }}-built branch
      if: steps.extract-is-built-branch.outputs.value == 'false' && steps.extract-branch.outputs.value != 'false' && github.repository != 'alleyinteractive/create-wordpress-plugin'
      shell: bash
      env:
        CURRENT_BRANCH: '${{ steps.extract-branch.outputs.value }}'
        CREATING_RELEASE: ${{ steps.extract-version.outputs.value != 'false' && steps.extract-tag-exists.outputs.value == 'false' && 'true' }}
      run: |
        git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
        git config --global user.name "$GITHUB_ACTOR"

        rm -rf docker_tag output.log

        # Clear out the .gitignore file if .deployignore exists
        if [[ -f "$GITHUB_WORKSPACE/.deployignore" ]]; then
          echo "Replacing .gitignore with .deployignore"
          mv .deployignore .gitignore
          git ls-files -i -c --exclude-standard . | xargs git rm --cached
        elif [[ -f "$GITHUB_WORKSPACE/.distignore" ]]; then
          echo "Replacing .gitignore with .distignore"
          mv .distignore .gitignore
          git ls-files -i -c --exclude-standard . | xargs git rm --cached
        fi

        git checkout -b "$BUILT_BRANCH"

        git add -A

        if [[ $CREATING_RELEASE == "true" ]]; then
          git commit -m "Built changes for $VERSION_TAG from $CURRENT_BRANCH $GITHUB_SHA"
        else
          git commit -m "Built changes from $CURRENT_BRANCH $GITHUB_SHA"
        fi

        git push --force -u origin "${BUILT_BRANCH}"

    - name: Create release for built branch
      if: steps.extract-is-built-branch.outputs.value == 'false' && steps.extract-branch.outputs.value != 'false' && github.repository != 'alleyinteractive/create-wordpress-plugin' && steps.extract-version.outputs.value != 'false' && steps.extract-tag-exists.outputs.value == 'false'
      shell: bash
      env:
        PREVIOUS_TAG_VERSION: '${{ steps.extract-previous-tag.outputs.value }}'
        DRAFT_RELEASE: '${{ inputs.draft }}'
      run: |
        echo "USE_CHANGELOG_NOTES: $USE_CHANGELOG_NOTES"
        echo "PREVIOUS_TAG_VERSION: $PREVIOUS_TAG_VERSION"
        echo "DRAFT_RELEASE: $DRAFT_RELEASE"

        if [[ "$USE_CHANGELOG_NOTES" == "true" ]] && [[ -n "$CHANGELOG_CONTENTS" ]]; then
          printf '%s\n' "$CHANGELOG_CONTENTS" > /tmp/release-notes.md
          cat /tmp/release-notes.md

          if [[ "$DRAFT_RELEASE" == "true" ]]; then
            gh release create "$VERSION_TAG" --target "$BUILT_BRANCH" -t "$VERSION_TAG" -F /tmp/release-notes.md -d --latest
          else
            gh release create "$VERSION_TAG" --target "$BUILT_BRANCH" -t "$VERSION_TAG" -F /tmp/release-notes.md --latest
          fi
        elif [ "$PREVIOUS_TAG_VERSION" == "false" ]; then
          if [[ "$DRAFT_RELEASE" == "true" ]]; then
            gh release create "$VERSION_TAG" --target "$BUILT_BRANCH" -t "$VERSION_TAG" --generate-notes -d --latest
          else
            gh release create "$VERSION_TAG" --target "$BUILT_BRANCH" -t "$VERSION_TAG" --generate-notes --latest
          fi
        else
          if [[ "$DRAFT_RELEASE" == "true" ]]; then
            gh release create "$VERSION_TAG" --target "$BUILT_BRANCH" -t "$VERSION_TAG" --generate-notes -d --latest --notes-start-tag "$PREVIOUS_TAG_VERSION"
          else
            gh release create "$VERSION_TAG" --target "$BUILT_BRANCH" -t "$VERSION_TAG" --generate-notes --latest --notes-start-tag "$PREVIOUS_TAG_VERSION"
          fi
        fi